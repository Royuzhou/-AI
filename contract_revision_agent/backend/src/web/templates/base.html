<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}合同修订智能体{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">⚖️ 合同修订智能体</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link {{ 'active' if request.path == '/' }}" href="/"><i class="bi bi-pencil-square"></i> 合同修订</a></li>
                    <li class="nav-item"><a class="nav-link {{ 'active' if request.path == '/knowledge' }}" href="/knowledge"><i class="bi bi-database"></i> 知识库</a></li>
                    <li class="nav-item"><a class="nav-link {{ 'active' if request.path == '/history' }}" href="/history"><i class="bi bi-clock-history"></i> 历史记录</a></li>
                    <li class="nav-item"><a class="nav-link {{ 'active' if request.path == '/settings' }}" href="/settings"><i class="bi bi-gear"></i> 系统设置</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item"><span class="nav-link text-light" id="nav-username"><i class="bi bi-person"></i> 加载中...</span></li>
                    <li class="nav-item"><a class="nav-link" href="/logout"><i class="bi bi-box-arrow-right"></i> 退出</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5">
        {% block content %}{% endblock %}
    </div>

    <div id="toast-container" class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999;"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    <script>
    // 加载当前用户
    fetch('/api/auth/me').then(r=>r.json()).then(d=>{
        document.getElementById('nav-username').innerHTML = '<i class="bi bi-person"></i> ' + (d.username || '未知');
    });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
