{% extends "base.html" %}
{% block title %}系统设置{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header"><h4 class="mb-0"><i class="bi bi-gear"></i> 系统配置</h4></div>
            <div class="card-body">
                <ul class="nav nav-tabs mb-4" role="tablist">
                    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-deepseek">🤖 DeepSeek API</button></li>
                    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-pinecone">🗄️ Pinecone</button></li>
                </ul>

                <div class="tab-content">
                    <!-- DeepSeek Tab -->
                    <div class="tab-pane fade show active" id="tab-deepseek">
                        <div class="mb-3">
                            <label class="form-label">API Key</label>
                            <input type="password" class="form-control" id="ds-api-key" placeholder="sk-...">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Base URL</label>
                            <input type="text" class="form-control" id="ds-base-url" value="https://api.deepseek.com/v1">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Model</label>
                            <input type="text" class="form-control" id="ds-model" value="deepseek-chat">
                        </div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-outline-primary" onclick="testDeepSeek()"><i class="bi bi-plug"></i> 测试连接</button>
                            <button class="btn btn-primary" onclick="saveDeepSeek()"><i class="bi bi-check-lg"></i> 保存</button>
                        </div>
                        <div id="ds-test-result" class="mt-3"></div>
                    </div>

                    <!-- Pinecone Tab -->
                    <div class="tab-pane fade" id="tab-pinecone">
                        <div class="mb-3">
                            <label class="form-label">API Key</label>
                            <input type="password" class="form-control" id="pc-api-key" placeholder="pcsk_...">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Index Name</label>
                            <input type="text" class="form-control" id="pc-index" value="software">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Top K (检索返回数)</label>
                            <input type="number" class="form-control" id="pc-topk" value="3" min="1" max="20">
                        </div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-outline-primary" onclick="testPinecone()"><i class="bi bi-plug"></i> 测试连接</button>
                            <button class="btn btn-primary" onclick="savePinecone()"><i class="bi bi-check-lg"></i> 保存</button>
                        </div>
                        <div id="pc-test-result" class="mt-3"></div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}<script src="{{ url_for('static', filename='js/settings.js') }}"></script>{% endblock %}
