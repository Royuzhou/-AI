{% extends "base.html" %}
{% block title %}历史记录{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-10">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h4 class="mb-0"><i class="bi bi-clock-history"></i> 历史修订记录</h4>
                <button class="btn btn-sm btn-outline-secondary" onclick="loadSessions()"><i class="bi bi-arrow-clockwise"></i> 刷新</button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover" id="sessions-table">
                        <thead><tr><th>时间</th><th>合同文件</th><th>消息数</th><th>状态</th><th>操作</th></tr></thead>
                        <tbody id="sessions-body"><tr><td colspan="5" class="text-center text-muted">加载中...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 会话详情 模态框 -->
        <div class="modal fade" id="detail-modal" tabindex="-1">
            <div class="modal-dialog modal-xl modal-dialog-scrollable">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">会话详情</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body" id="detail-body"></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}<script src="{{ url_for('static', filename='js/history.js') }}"></script>{% endblock %}
