{% extends "base.html" %}
{% block title %}法律知识库管理{% endblock %}

{% block content %}
<div class="row">
    <!-- 左侧: 上传区 -->
    <div class="col-lg-5">
        <div class="card mb-4">
            <div class="card-header"><h5 class="mb-0"><i class="bi bi-cloud-upload"></i> 上传文档</h5></div>
            <div class="card-body">
                <div class="upload-area" id="upload-area">
                    <i class="bi bi-file-earmark-arrow-up" style="font-size: 2.5rem; color: #667eea;"></i>
                    <p class="mt-2 mb-1 fw-bold">拖拽文件到此处或点击上传</p>
                    <p class="text-muted small">支持 .pdf / .docx / .txt 格式</p>
                    <input type="file" id="kb-file-input" accept=".pdf,.docx,.txt" hidden onchange="onFileSelected(event)">
                    <button class="btn btn-outline-primary mt-2" onclick="document.getElementById('kb-file-input').click()">选择文件</button>
                </div>
                <div id="upload-file-info" class="d-none mt-3">
                    <div class="d-flex align-items-center justify-content-between p-2 bg-light rounded">
                        <span id="upload-filename"></span>
                        <button class="btn btn-sm btn-outline-danger" onclick="clearFile()">✕</button>
                    </div>
                    <div class="mt-3">
                        <label class="form-label">分块大小 (字符)</label>
                        <input type="number" class="form-control" id="chunk-size" value="500" min="100" max="2000">
                    </div>
                    <button class="btn btn-primary w-100 mt-2" id="process-btn" onclick="processDocument()">
                        <i class="bi bi-cpu"></i> 处理并入库
                    </button>
                </div>
                <div id="process-progress" class="d-none mt-3">
                    <div class="progress"><div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 100%"></div></div>
                    <p class="text-center text-muted mt-1 small">正在解析文档、生成向量、写入 Pinecone...</p>
                </div>
                <div id="process-result" class="mt-3"></div>
            </div>
        </div>
    </div>

    <!-- 右侧: 搜索 + 状态 -->
    <div class="col-lg-7">
        <div class="card mb-4">
            <div class="card-header"><h5 class="mb-0"><i class="bi bi-search"></i> 知识库搜索</h5></div>
            <div class="card-body">
                <div class="input-group">
                    <input type="text" class="form-control" id="search-query" placeholder="输入法律条款关键词..." onkeydown="if(event.key==='Enter')searchKB()">
                    <button class="btn btn-primary" onclick="searchKB()"><i class="bi bi-search"></i> 搜索</button>
                </div>
                <div id="search-results" class="mt-3"></div>
            </div>
        </div>

        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="bi bi-bar-chart"></i> 知识库状态</h5>
                <button class="btn btn-sm btn-outline-secondary" onclick="refreshStatus()"><i class="bi bi-arrow-clockwise"></i></button>
            </div>
            <div class="card-body">
                <div class="row text-center" id="kb-stats">
                    <div class="col-4"><div class="stat-value" id="stat-vectors">--</div><small class="text-muted">向量总数</small></div>
                    <div class="col-4"><div class="stat-value" id="stat-dimension">--</div><small class="text-muted">向量维度</small></div>
                    <div class="col-4"><div class="stat-value" id="stat-connected">--</div><small class="text-muted">连接状态</small></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}<script src="{{ url_for('static', filename='js/knowledge.js') }}"></script>{% endblock %}
